name: iOS build
on:
  workflow_dispatch:
  push:
    branches: [main]
defaults:
  run:
    working-directory: aletheia-ios/aletheia-ios
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Prepare Gradle wrapper
        run: |
          chmod +x gradlew
          sed -i '' 's/networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          for i in 1 2 3 4; do ./gradlew --version && break || sleep 15; done
      - name: Download dependencies and compile Kotlin (with retries)
        run: |
          for i in 1 2 3 4; do
            ./gradlew :shared:compileKotlinIosSimulatorArm64 --no-daemon && exit 0
            echo "Attempt $i failed, retrying in 30s"; sleep 30
          done
          exit 1
      - name: Generate Xcode project
        run: cd iosApp && xcodegen generate
      - name: Build for iOS Simulator
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -sdk iphonesimulator -configuration Debug \
            -destination 'generic/platform=iOS Simulator' build
